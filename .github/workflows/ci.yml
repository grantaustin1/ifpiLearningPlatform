
name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ─── Gate: secrets first, fast fail ────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/security/scan-secrets.sh && bash scripts/security/scan-secrets.sh --ci

  # ─── Backend smoke + unit/integration tests ────────────────────
  backend-tests:
    name: Backend Pytest
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx
      - name: Bootstrap DB
        working-directory: backend
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: sqlite:///./ifpi_ci.db
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ifpi_test
        run: |
          alembic upgrade head
          python -c "from seed_data import seed; seed()" || true
      - name: Run pytest
        working-directory: backend
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: sqlite:///./ifpi_ci.db
          SMTP_ALLOW_PLAINTEXT: '1'
        run: pytest -q --maxfail=5

  # ─── Migration smoke: head → downgrade -1 → head ───────────────
  migration-smoke:
    name: Migration Smoke (up/down/up)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r backend/requirements.txt
      - name: Alembic upgrade head → downgrade -1 → upgrade head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ifpi_mig.db
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  # ─── Service-layer guard (advisory in IFPI; warn only) ─────────
  service-layer-check:
    name: Service Layer Guard
    runs-on: ubuntu-latest
    needs: secret-scan
    continue-on-error: true   # advisory while we refactor existing routers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan diff for direct DB access in routers
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD -- 'backend/routers/*.py' 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "No router files changed in this PR — skipping."; exit 0
          fi
          VIOL=""
          for f in $CHANGED; do
            HITS=$(grep -nE "db\.(query|execute|commit|add|delete|refresh)" "$f" || true)
            [ -n "$HITS" ] && VIOL="$VIOL\n$f:\n$HITS\n"
          done
          if [ -n "$VIOL" ]; then
            echo "::warning::Direct DB access in router(s). Consider moving to service layer."
            printf "$VIOL"
          fi

  # ─── QA Agents: governance + infra (allow E2E to be optional) ──
  qa-agents:
    name: QA Agents (007 invariants + 010 infra)
    runs-on: ubuntu-latest
    needs: [backend-tests, migration-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r backend/requirements.txt
      - name: Bootstrap DB
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ifpi_ci.db
        run: |
          alembic upgrade head
          python -m seed.seed_minimal
      - name: Start backend (background) for agent 008
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ifpi_ci.db
          JWT_SECRET: test-secret-for-ci
          SMTP_ALLOW_PLAINTEXT: '1'
        run: |
          (uvicorn server:app --host 127.0.0.1 --port 8001 &) && sleep 4
      - name: Agent 007 — Invariants
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ifpi_ci.db
        run: python scripts/qa_agents/agent_007_invariants.py
      - name: Agent 008 — E2E learner journey
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ifpi_ci.db
          API_URL: http://127.0.0.1:8001
        run: python scripts/qa_agents/agent_008_e2e_journey.py
      - name: Agent 010 — Infra Sentry
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ifpi_ci.db
          API_URL: http://127.0.0.1:8001
          SMTP_ALLOW_PLAINTEXT: '1'
          EMERGENT_LLM_KEY: ${{ secrets.EMERGENT_LLM_KEY }}
        run: python scripts/qa_agents/agent_010_infra_sentry.py || true   # advisory until C-1 settled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-reports
          path: test_reports/agent_*.json

  # ─── Frontend lint + typecheck ─────────────────────────────────
  frontend:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'yarn', cache-dependency-path: frontend/yarn.lock }
      - working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          CI=true yarn build
