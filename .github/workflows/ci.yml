name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ─── Gate: secrets first, fast fail ────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/security/scan-secrets.sh && bash scripts/security/scan-secrets.sh --ci

  # ─── Backend smoke + unit/integration tests ────────────────────
  backend-tests:
    name: Backend Pytest
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          pip install -r backend/requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          pip install pytest pytest-cov httpx
      - name: Bootstrap DB
        working-directory: backend
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: sqlite:///./ifpi_ci.db
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ifpi_test
        run: |
          alembic upgrade head
          python -c "from seed_data import seed; seed()" || true
      - name: Run pytest
        working-directory: backend
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: sqlite:///./ifpi_ci.db
          SMTP_ALLOW_PLAINTEXT: '1'
        run: pytest -q --maxfail=5

  # ─── Migration smoke: head → downgrade -1 → head ───────────────
  migration-smoke:
    name: Migration Smoke (up/down/up)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r backend/requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - name: Alembic upgrade head → downgrade -1 → upgrade head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ifpi_mig.db
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  # ─── Service-layer guard (advisory in IFPI; warn only) ─────────
  service-layer-check:
    name: Service Layer Guard
    runs-on: ubuntu-latest
    needs: secret-scan
    continue-on-error: true   # advisory while we refactor existing routers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan diff for direct DB access in routers
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD -- 'backend/routers/*.py' 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "No router files changed in this PR — skipping."; exit 0
          fi
          VIOL=""
          for f in $CHANGED; do
            HITS=$(grep -nE "db\.(query|execute|commit|add|delete|refresh)" "$f" || true)
            [ -n "$HITS" ] && VIOL="$VIOL\n$f:\n$HITS\n"
          done
          if [ -n "$VIOL" ]; then
            echo "::warning::Direct DB access in router(s). Consider moving to service layer."
            printf "$VIOL"
          fi

  # ─── QA Agents: governance + infra (allow E2E to be optional) ──
  qa-agents:
    name: QA Agents (007 invariants + 010 infra)
    runs-on: ubuntu-latest
    needs: [backend-tests, migration-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r backend/requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - name: Bootstrap DB
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ifpi_ci.db
        run: |
          alembic upgrade head
          python -m seed.seed_minimal
      - name: Start backend (background) for agent 008
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ifpi_ci.db
          JWT_SECRET: test-secret-for-ci
          SMTP_ALLOW_PLAINTEXT: '1'
        run: |
          (uvicorn server:app --host 127.0.0.1 --port 8001 &) && sleep 4
      - name: Agent 007 — Invariants
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ifpi_ci.db
        run: python scripts/qa_agents/agent_007_invariants.py
      - name: Agent 008 — E2E learner journey
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ifpi_ci.db
          API_URL: http://127.0.0.1:8001
        run: python scripts/qa_agents/agent_008_e2e_journey.py
      - name: Agent 010 — Infra Sentry
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ifpi_ci.db
          API_URL: http://127.0.0.1:8001
          SMTP_ALLOW_PLAINTEXT: '1'
          EMERGENT_LLM_KEY: ${{ secrets.EMERGENT_LLM_KEY }}
        run: python scripts/qa_agents/agent_010_infra_sentry.py || true   # advisory until C-1 settled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-reports
          path: test_reports/agent_*.json

  # ─── Frontend lint + typecheck ─────────────────────────────────
  frontend:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'yarn', cache-dependency-path: frontend/yarn.lock }
      - working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          CI=true yarn build


  # ─── Docs drift gate ───────────────────────────────────────────
  # Fails the build if the AUTO-BLOCKs in /docs/IFPI_*_MANUAL.md are
  # stale relative to the live router/model/role registries. Contributors
  # who add a router without regenerating docs get a clear error with
  # the fix command. Also runs the coverage tests that ensure every
  # /api route + router file is mentioned somewhere in a manual.
  docs-drift:
    name: Docs Drift Gate
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          pip install -r backend/requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          pip install pytest
      - name: Regenerate check
        working-directory: backend
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: sqlite:///./ifpi_ci_docs.db
        run: |
          python -c "import server" || true  # warm import; failures OK — build_docs handles it
          python scripts/build_docs.py --check
      - name: Route + router coverage
        working-directory: backend
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: sqlite:///./ifpi_ci_docs.db
          RUN_INTEGRATION_TESTS: '0'
        run: |
          python -m pytest tests/test_docs_completeness.py -q --maxfail=3
      - name: Emit HTML render (artifact for preview)
        working-directory: backend
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: sqlite:///./ifpi_ci_docs.db
        run: python scripts/build_docs.py --html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ifpi-master-manual-html
          path: frontend/public/docs/IFPI_Master_Manual.html

  # ─── Locust smoke load-suite (Iter 30j) ─────────────────────────
  # Spins up the backend, seeds it, and hits every canonical endpoint
  # under a 5-user × 30s load. Fails CI if p95 > 2000ms or if any
  # request errors > 1%. Uses the pre-existing scripts/locustfile.py.
  locust-smoke:
    name: Locust Smoke Load
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          pip install locust
      - name: Bootstrap DB + seed
        working-directory: backend
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: sqlite:///./ifpi_locust.db
          SMTP_ALLOW_PLAINTEXT: '1'
        run: |
          alembic upgrade head
          python -c "from seed_data import seed; seed()" || true
      - name: Start backend in background
        working-directory: backend
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: sqlite:///./ifpi_locust.db
          SMTP_ALLOW_PLAINTEXT: '1'
        run: |
          nohup uvicorn server:app --host 0.0.0.0 --port 8001 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/api/branding/public > /dev/null && break
            sleep 1
          done
      - name: Run Locust smoke (5 users × 30s)
        working-directory: backend
        run: |
          locust -f scripts/locustfile.py --headless \
            -u 5 -r 2 -t 30s \
            --host http://localhost:8001 \
            --tags smoke \
            --csv=/tmp/locust \
            --exit-code-on-error 0
      - name: Assert perf gates (p95 + error rate)
        run: |
          python3 - <<'PY'
          import csv, sys, os
          # locust_stats.csv columns: Type,Name,Request Count,Failure Count,...,
          # '50%','66%','75%','80%','90%','95%','98%','99%','99.9%','99.99%','100%',
          # 'Average Response Time','Min Response Time','Max Response Time',
          # 'Average Content Size','Requests/s','Failures/s'
          path = "/tmp/locust_stats.csv"
          if not os.path.exists(path):
              print("locust_stats.csv missing — smoke run failed to emit stats", file=sys.stderr)
              sys.exit(1)
          with open(path) as f:
              rows = list(csv.DictReader(f))
          agg = [r for r in rows if r.get("Name") == "Aggregated"]
          if not agg:
              print("no Aggregated row in stats", file=sys.stderr); sys.exit(1)
          a = agg[0]
          reqs = int(a["Request Count"])
          fails = int(a["Failure Count"])
          # locust writes p95 as an integer millisecond value
          p95 = int(a["95%"])
          err_rate = (fails / reqs) if reqs else 0.0
          print(f"reqs={reqs} fails={fails} err_rate={err_rate*100:.2f}% p95={p95}ms")
          if reqs < 10:
              print("Too few requests — backend probably didn't respond", file=sys.stderr); sys.exit(1)
          if err_rate > 0.05:
              print(f"error rate {err_rate*100:.2f}% > 5% budget", file=sys.stderr); sys.exit(1)
          if p95 > 3000:
              print(f"p95 {p95}ms > 3000ms budget", file=sys.stderr); sys.exit(1)
          print("Locust smoke gates PASS")
          PY
      - name: Upload locust artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-smoke-report
          path: /tmp/locust_*.csv
