[mypy]
python_version = 3.11
ignore_missing_imports = True
check_untyped_defs = True
no_implicit_optional = False
warn_unused_ignores = False
allow_redefinition = True
exclude = (alembic/|tests/|scripts/)
# Legacy SQLAlchemy Column() declarations generate hundreds of false
# assignment/arg-type positives. Disabled globally so real signal
# (union-attr, attr-defined, operator, index, return-value) stays visible.
# Re-enable these when models migrate to SQLAlchemy 2.0 Mapped[] typing.
disable_error_code = assignment, arg-type, var-annotated

# Ratchet: new service modules are held to a higher bar
[mypy-services.enrollment_service]
disallow_untyped_defs = True

[mypy-services.course_lifecycle_service]
disallow_untyped_defs = True
